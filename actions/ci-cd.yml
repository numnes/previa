# Copy to your app repo: .github/workflows/ci-cd.yml
# Repository secrets: PREVIA_API_URL, PREVIA_API_KEY
# PROJECT_SLUG is set by previa project init
# Teardown runs on PR close and when a branch is deleted on the remote
name: Previa CI — preview

on:
  pull_request:
    branches:
      - master
      - homologation
  delete:

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Request preview deploy
        env:
          PREVIA_API_URL: ${{ secrets.PREVIA_API_URL || secrets.DEPLOYER_API_URL }}
          PREVIA_API_KEY: ${{ secrets.PREVIA_API_KEY || secrets.DEPLOYER_API_KEY }}
          PROJECT_SLUG: __PREVIA_PROJECT_SLUG__
        run: |
          if [ -z "$PREVIA_API_URL" ] || [ -z "$PREVIA_API_KEY" ]; then
            echo "Set repository secrets PREVIA_API_URL and PREVIA_API_KEY (or legacy DEPLOYER_*)."
            exit 1
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          curl -fsS -X POST "${PREVIA_API_URL%/}/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Previa-Api-Key: ${PREVIA_API_KEY}" \
            -d "{\"project\":\"${PROJECT_SLUG}\",\"branch\":\"${BRANCH}\"}"

  teardown-preview:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview instance
        env:
          PREVIA_API_URL: ${{ secrets.PREVIA_API_URL || secrets.DEPLOYER_API_URL }}
          PREVIA_API_KEY: ${{ secrets.PREVIA_API_KEY || secrets.DEPLOYER_API_KEY }}
          PROJECT_SLUG: __PREVIA_PROJECT_SLUG__
        run: |
          if [ -z "$PREVIA_API_URL" ] || [ -z "$PREVIA_API_KEY" ]; then
            echo "Set repository secrets PREVIA_API_URL and PREVIA_API_KEY (or legacy DEPLOYER_*)."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.event.ref }}"
            BRANCH="${BRANCH#refs/heads/}"
          fi
          curl -fsS -X POST "${PREVIA_API_URL%/}/deploy/destroy" \
            -H "Content-Type: application/json" \
            -H "X-Previa-Api-Key: ${PREVIA_API_KEY}" \
            -d "{\"project\":\"${PROJECT_SLUG}\",\"branch\":\"${BRANCH}\"}"
